<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ filename }} - {{ agent_name }}</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0d1117; color:#c9d1d9; padding:20px; }
.container { max-width:1000px; margin:0 auto; }
h1 { color:#58a6ff; font-size:1.3rem; display:inline; word-break:break-all; }
.time { color:#8b949e; font-size:0.85rem; float:right; }
.back { color:#8b949e; font-size:0.85rem; display:block; margin-bottom:12px; }
.back:hover { color:#58a6ff; }
.meta { color:#8b949e; font-size:0.82rem; margin:10px 0; }
pre { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:16px; font-family:'SF Mono','Cascadia Code',monospace; font-size:0.82rem; line-height:1.5; overflow:auto; white-space:pre-wrap; word-wrap:break-word; color:#c9d1d9; max-height:80vh; }
pre::-webkit-scrollbar { width:8px; }
pre::-webkit-scrollbar-track { background:#0d1117; border-radius:4px; }
pre::-webkit-scrollbar-thumb { background:#30363d; border-radius:4px; }
</style>
</head>
<body>
<div class="container">
  <a href="/agent/{{ agent_name }}" class="back">&larr; Back to {{ agent_name }}</a>
  <h1>{{ filename }}</h1>
  <span class="time">{{ now }}</span>
  <div class="meta">
    Agent: <a href="/agent/{{ agent_name }}">{{ agent_name }}</a> &middot;
    File: <code>{{ filename }}</code> &middot;
    <a href="/agent/{{ agent_name }}" class="back" style="display:inline;">Back to agent</a>
  </div>
  <pre><code>{{ content }}</code></pre>
</div>
</body>
</html>
